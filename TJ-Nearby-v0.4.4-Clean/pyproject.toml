[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tj-nearby"
version = "0.4.4"
description = "GPS-first TransJakarta nearby-stop monitor and bus arrival notifier for Windows and macOS"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Miftahul Ardli"}]
dependencies = [
  "httpx>=0.27,<1",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
mac = [
  "pyobjc-framework-CoreLocation>=10.3",
  "pyobjc-framework-Cocoa>=10.3",
  "rumps>=0.4.0",
]
windows = [
  "Pillow>=10.4,<13",
  "pystray>=0.19.5,<0.20",
  "winrt-runtime>=3.2.1,<4",
  "winrt-Windows.Foundation>=3.2.1,<4",
  "winrt-Windows.Devices.Geolocation>=3.2.1,<4",
]
build = ["py2app>=0.28.10"]
windows-build = ["pyinstaller>=6.21,<7", "pyinstaller-versionfile>=3.1,<4"]
test = ["pytest>=8.0"]

[project.scripts]
tj-nearby = "tj_nearby.cli:main"
tj-nearby-menubar = "tj_nearby.menubar:main"
tj-nearby-windows = "tj_nearby.windows_gui:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
tj_nearby = ["assets/*.png", "assets/*.ico", "assets/*.yaml"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
